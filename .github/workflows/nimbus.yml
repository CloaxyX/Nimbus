name: Nimbus build

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Rebrand and build
        run: |
          set -e
          echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;30.0.16248370"
          export NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app
          mkdir -p V2rayNG/app/libs
          if TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0 2>/dev/null); then :; else git -C AndroidLibXrayLite fetch --tags -q; TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0); fi
          echo "tag=$TAG"
          curl -sL -o V2rayNG/app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/$TAG/libv2ray.aar"
          ls -l V2rayNG/app/libs
          sed -i 's|>v2rayNG<|>Nimbus<|' V2rayNG/app/src/main/res/values/strings.xml
          sed -i 's|applicationId = "com.v2ray.ang"|applicationId = "com.nimbus.vpn"|' V2rayNG/app/build.gradle.kts
          cd V2rayNG
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: nimbus-apk
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
